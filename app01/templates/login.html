<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>用户登录</title>
    <style>
        /* 和注册页面类似的基础样式 */
        body { background-color: #e0f7fa; font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .box { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); width: 300px; }
        .box h2 { text-align: center; color: #333; }
        .form-group { margin-bottom: 15px; }
        .form-group input { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 5px; }
        .verify-code { display: flex; justify-content: space-between; }
        .verify-code input { width: 60%; }
        .verify-code img { cursor: pointer; width: 35%; border-radius: 5px; }
        .btn { width: 100%; padding: 10px; background-color: #00bcd4; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; }
        .btn:hover { background-color: #0097a7; }
        .error { color: red; font-size: 14px; text-align: center; margin-bottom: 10px; }
        .link { text-align: center; margin-top: 10px; display: block; color: #00bcd4; text-decoration: none; }
    </style>
</head>
<body>
    <div class="box">
        <h2>用户登录</h2>
        {% if error_msg %}
            <div class="error">{{ error_msg }}</div>
        {% endif %}
        <form method="post" action="/login/">
            {% csrf_token %}
            <div class="form-group">
                <input type="text" name="uid" placeholder="请输入用户名" required>
            </div>
            <div class="form-group">
                <input type="password" name="psw" placeholder="请输入密码" required>
            </div>
            <div class="form-group verify-code">
                <input type="text" name="code" placeholder="请输入验证码" required>
                <!-- 点击图片可以刷新验证码 -->
                <img src="/get_verify_code/" alt="验证码" onclick="this.src='/get_verify_code/?t=' + new Date().getTime();">
            </div>
            <button type="submit" class="btn">登录</button>
        </form>
        <a href="/register/" class="link">没有账号？去注册</a>
    </div>
</body>
</html>
